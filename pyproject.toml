[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SAM"
version = "0.2.0"
description = "Quantitative research and engineering platform."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mohit Saharan" }]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/msaharan/sam"
Repository = "https://github.com/msaharan/sam"
Issues = "https://github.com/msaharan/sam/issues"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "xgboost>=2.0",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
notebooks = [
    "ipykernel>=6.0",
    "matplotlib>=3.8",
]
volatility = [
    "matplotlib>=3.8",
]
tfm = [
    "tabpfn",
    "tabicl",
    "torch",
]

[project.scripts]
sam = "sam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sam/volatility_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require network access or optional heavy dependencies",
    "volatility: tests that require matplotlib figures or optional TFM dependencies",
]

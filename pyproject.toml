[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SAM"
version = "0.1.0"
description = "Quantitative research and engineering platform."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mohit Saharan" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
notebooks = [
    "ipykernel>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
sam = "sam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

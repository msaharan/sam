[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam"
version = "0.1.0"
description = "Production trading orchestration on ML4T libraries."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Mohit Saharan" }]
keywords = ["trading", "backtest", "ml4t", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "polars>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
data = ["ml4t-data", "ml4t-diagnostic"]
backtest = ["ml4t-backtest"]
live = ["ml4t-live"]
research = ["ml4t-engineer", "ml4t-diagnostic", "ml4t-models"]
all = [
    "ml4t-data",
    "ml4t-engineer",
    "ml4t-diagnostic",
    "ml4t-models",
    "ml4t-backtest",
    "ml4t-live",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
sam = "sam.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network or broker credentials",
]

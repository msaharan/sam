id = "cross-sectional-equity-ranking"
name = "Cross-Sectional Equity Ranking"
hypothesis = "Cross-sectional equity ranking can become SAM's flagship quant research workflow only after point-in-time, survivorship, liquidity, sector, and cost caveats are made explicit."
status = "planned"
visibility = "open_core"
tags = ["equities", "ranking", "factor-models", "ml", "research-roadmap"]
metrics = ["rank_ic", "spearman", "precision_at_k", "long_short_return", "sharpe", "max_drawdown", "turnover", "sector_exposure", "cost_adjusted_return"]
limitations = [
  "Public fundamental data is often not point-in-time safe.",
  "Survivorship bias can dominate naive equity universes.",
  "Liquidity, borrow, market impact, and corporate action handling must be modeled before strategy claims.",
]
sam_takeaway = "Defer flagship equity ranking until the data-quality contract is strong enough to protect credibility."

[data]
source = "public OHLCV first; fundamentals only after point-in-time policy is defined"
universe = "US large-cap research universe"
symbols = ["US_LARGE_CAP_RESEARCH_UNIVERSE"]
fields = ["open", "high", "low", "close", "adj_close", "volume", "market_cap_optional", "fundamentals_optional"]
adjusted_policy = "use adjusted prices for return research; preserve raw fields where execution diagnostics need them"
timestamp_convention = "all fundamentals and classifications must be timestamped by availability date before use"
missing_data_policy = "track missingness explicitly and avoid forward-filling unavailable fundamentals across release dates"
start = "2010-01-01"

[features]
families = ["momentum", "reversal", "volatility", "liquidity", "size", "value_optional", "quality_optional", "sector", "market_regime"]
lookback_windows_days = [5, 21, 63, 126, 252]
leakage_policy = "features must be computed from data available at or before each rebalance date; fundamentals require explicit availability timestamps"
static_identity_policy = "diagnostic_only"

[target]
name = "forward_cross_sectional_return_rank"
task = "ranking"
horizon_days = 21
label_definition = "rank stocks by next-month forward return within the eligible universe and evaluate top/bottom groups"
execution_convention = "signal at rebalance close or next open; execution convention must be declared before model fitting"
target_timestamp = "end of forward return horizon"
allow_overlapping_labels = false

[validation]
split_policy = "walk_forward"
embargo_days = 5
overlap_policy = "prefer non-overlapping monthly labels; use embargo if weekly horizons are introduced"
train_window_days = 756
test_window_days = 63
step_days = 63

[[validation.windows]]
name = "research_bootstrap"
start = "2010-01-01"
end = "2016-12-31"
purpose = "feature and data-quality exploration"

[[validation.windows]]
name = "model_selection"
start = "2017-01-01"
end = "2019-12-31"
purpose = "model and decision-policy selection"

[[validation.windows]]
name = "holdout"
start = "2020-01-01"
end = "2026-12-31"
purpose = "future-facing evaluation after the data contract is stable"

[decision]
workflow = "ranking"
allocation_rule = "long top-ranked basket and optionally short or underweight bottom-ranked basket after liquidity and cost filters"
alert_threshold_policy = "not applicable"
cost_model_bps = 10.0
slippage_bps = 5.0
turnover_limit = 2.0
risk_controls = ["sector neutrality audit", "liquidity filter", "turnover cap", "cost sensitivity", "factor exposure analysis"]

[models]
baselines = ["linear factor model", "ridge", "momentum", "sector-neutral momentum", "equal weight"]
candidates = ["LightGBM or XGBoost ranker", "Random Forest", "TabPFN or TabICL rolling-window scorer", "calibrated top-quintile classifier"]
selection_policy = "do not publish alpha claims until survivorship, point-in-time data, costs, and factor exposures are audited"

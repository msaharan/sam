universe = "configs/universes/etf_core.toml"
market = "us"
data_source = "yfinance"
start = "2018-01-01"
price_output = "data/raw/etf_core.parquet"
refresh_data = true

ml_config = "configs/ml/baseline.toml"
model_dir = "models/latest"
model_path = "models/latest/model.pkl"
train_if_missing = true
retrain = false

risk_symbol = "SPY"
